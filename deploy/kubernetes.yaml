apiVersion: apps/v1
kind: Deployment
metadata:
  name: cds-relay
  labels:
    app.kubernetes.io/name: cds-relay
    app.kubernetes.io/instance: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cds-relay
      app.kubernetes.io/instance: development
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cds-relay
        app.kubernetes.io/instance: development
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: ghcr.io/cdsctf/relay:dev
          imagePullPolicy: Always
          args:
            - --listen
            - 0.0.0.0:9527
            - --identity
            - /run/secrets/relay/server.json
          ports:
            - name: quic
              containerPort: 9527
              protocol: UDP
          volumeMounts:
            - name: identity
              mountPath: /run/secrets/relay
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: identity
          secret:
            secretName: cds-relay-identity
            defaultMode: 0440
            items:
              - key: server.json
                path: server.json
---
apiVersion: v1
kind: Service
metadata:
  name: cds-relay
  labels:
    app.kubernetes.io/name: cds-relay
    app.kubernetes.io/instance: development
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cds-relay
    app.kubernetes.io/instance: development
  ports:
    - name: quic
      port: 9527
      targetPort: quic
      protocol: UDP
