[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
cds-relay-protocol = { path = "crates/protocol" }
cds-relay-client = { path = "crates/client" }
cds-relay-native = { path = "crates/native" }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcgen = "0.13.2"
# Keep certificate generation compatible with the workspace MSRV.
time = "=0.3.45"
tokio = { version = "1.53", features = ["io-util", "net", "rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
